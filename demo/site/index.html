<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AniSpeakArchive Demo</title>
  <meta name="description" content="A static demo of AniSpeakArchive: hybrid search over animal-communication research papers, running entirely in the browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="#/">
        <span class="brand-logo" aria-hidden="true">🦜</span>
        <span class="brand-text">
          <span class="brand-title">AniSpeakArchive <span class="demo-pill">demo</span></span>
          <span class="brand-subtitle">Animal communication research search</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a class="nav-link" data-route="search" href="#/">Search</a>
        <a class="nav-link" data-route="ask" href="#/ask">Ask AI</a>
        <a class="nav-link" data-route="about" href="#/about">About</a>
      </nav>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite">
    <p class="muted loading">Loading papers…</p>
  </main>

  <footer class="footer container">
    <span>Paper metadata from <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a> (CC0).</span>
    <span>Static demo: search runs in your browser.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.1/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
