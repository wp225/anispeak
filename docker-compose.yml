name: george_anispeak

services:

  # ─────────────────────────────────────────────
  # Web application
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: george_anispeak_app
    ports:
      - "5696:5696"
    volumes:
      - ./cache:/app/cache          # LanceDB index + auth.sqlite
      - ./data:/app/data            # species data, web corpus
      - ./logs:/app/logs
      - huggingface_cache:/root/.cache/huggingface
      # corpus/ is large (~100GB) — mount from host, do not bake into image.
      - ./corpus:/app/corpus:ro
    environment:
      - FLASK_ENV=production
      # GPU access via env var — works without nvidia as default runtime
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # SMTP — all required; set in .env file before running.
      # See .env.example for reference. Missing vars will cause a startup error.
      - ASA_SMTP_HOST
      - ASA_SMTP_PORT
      - ASA_SMTP_USERNAME
      - ASA_SMTP_PASSWORD
      - ASA_SMTP_FROM
      - ASA_SMTP_USE_TLS
      # Internal service URLs — containers communicate via service name on Docker network
      - GBIF_URL=http://gbif:8080
      - GNPARSER_URL=http://gnparser:8080
      # Auth policy
      - ASA_ALLOW_EDU_ONLY=${ASA_ALLOW_EDU_ONLY:-true}
      - ASA_ALLOWED_DOMAINS=${ASA_ALLOWED_DOMAINS:-}
    depends_on:
      gbif:
        condition: service_healthy
      gnparser:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Offline pipeline (run explicitly via --profile pipeline)
  # WARNING: pipeline and app both mount ./cache. Do NOT run pipeline while
  # the app is serving traffic — concurrent LanceDB writes can cause corruption.
  # ─────────────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: george_anispeak_pipeline
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./corpus:/app/corpus:ro     # pipeline reads corpus but does not write it
      - huggingface_cache:/root/.cache/huggingface
      - /supernova/data/lekhak/models:/models:ro
    environment:
      - PIPELINE_QWEN_MODEL=/models/Qwen2.5-14B-Instruct
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # Won't start with `docker compose up` — run explicitly:
    #   docker compose --profile pipeline run --rm pipeline
    profiles: [pipeline]

  # ─────────────────────────────────────────────
  # GBIF species matching service
  # Pinned to same image as shared server instance — we own and manage this.
  # Port 5700 to avoid conflict with existing shared instance on 5643.
  # ─────────────────────────────────────────────
  gbif:
    image: docker.gbif.org/matching-ws:xcol-amd64-latest
    container_name: george_anispeak_gbif
    ports:
      - "5700:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Scientific name parser
  # Port 5701 to avoid conflict with existing shared instance on 5644.
  # ─────────────────────────────────────────────
  gnparser:
    image: gnames/gognparser:v1.14.2
    container_name: george_anispeak_gnparser
    command: ["gnparser", "-p", "8080", "--jobs", "8"]
    ports:
      - "5701:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  huggingface_cache: