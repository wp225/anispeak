app:
  host: "0.0.0.0"
  port: 5636
  debug: true
  secret_key: "dev-only-change-me"
# -------------------------
# AUTH / OTP (UI + Policy)
# -------------------------
auth:
  # Prefer restricting access to academic emails.
  # Enforcement is implemented in routes_auth.py via app.config["AUTH_CFG"] and env vars.
  # This config block is informational unless you wire it into load_settings().
  allow_edu_only: true

  # Optional allowlist (leave empty to allow any .edu)
  allowed_domains: []

  # Support contact shown in UI.
  support_email: "uta.acl2@gmail.com"

  # Branding (used by templates; keep in sync with footer)
  lab_name: "Arlington Computational Linguistics Lab (ACL2)"
  lab_website: "https://redgiant.uta.edu/index.html"

# -------------------------
# SMTP (OTP email delivery)
# -------------------------
# Secrets should live in .env, not committed YAML. We keep placeholders here for clarity.
smtp:
  host: "${ASA_SMTP_HOST}"
  port: "${ASA_SMTP_PORT}"
  username: "${ASA_SMTP_USERNAME}"
  password: "${ASA_SMTP_PASSWORD}"
  from_email: "${ASA_SMTP_FROM}"
  use_tls: "${ASA_SMTP_USE_TLS}"

paths:
  # Path to Qwen-filtered corpus (Stage 2 output)
  final_relevant_jsonl: "data/processed/final_relevant.jsonl"

  # Web-friendly normalized corpus used for indexing
  web_corpus_jsonl: "data/web_corpus.jsonl"

  # LanceDB directory (vector + FTS index lives here)
  lancedb_dir: "cache/lancedb"

index:
  table_name: "papers"

  # Include OpenAlex abstract in retrieval text
  # Recommended: true
  include_abstract: true

  # Include author affiliations in retrieval text
  # Helps institution-based search
  include_affiliations: true

  # For debugging only: limit corpus size (null = use all)
  max_docs: null

  # Which columns get FTS (BM25) index
  # Usually only ["text"]
  fts_columns: ["text"]

  # Rebuild FTS index each time build_index runs
  fts_replace: true


# -------------------------
# EMBEDDING MODEL (Dense Retrieval)
# -------------------------
# embedding:
#   provider: "nvidia_hf"
#   model_name: "/supernova/data/lekhak/models/nvidia/llama-nv-embed-reasoning-3b"
#   normalize_embeddings: true
#   use_gpu: true
#   batch_size: 16
#   max_length: 4096
#   trust_remote_code: true
#   device: "cuda:1"
#   dtype: "bfloat16"
#   device_map: null

embedding:
  provider: "flag_embedding"
  model_name: "BAAI/bge-m3"
  normalize_embeddings: true
  use_gpu: true
  batch_size: 16
  max_length: 512
  trust_remote_code: false
  device: "cuda:0"


rerank:
  enabled: true
  provider: "flag_embedding"
  model_name: "BAAI/bge-reranker-base"
  use_gpu: true
  batch_size: 16
  max_length: 1024
  max_candidates: 50
  trust_remote_code: false
  device: "cuda:0"

# -------------------------
# CROSS-ENCODER RERANKER
