# -------------------------
# HYBRID SEARCH PARAMETERS
# -------------------------
search:
  # BM25 candidates
  # 100-300 typical
  k_lex: 200

  # Dense vector candidates
  # 100-300 typical
  k_dense: 200

  # RRF fusion constant
  # 50-100 typical
  rrf_k: 60

  # Final results returned per page
  top_k: 20


# -------------------------
# UI / FACET CONFIG
# -------------------------
ui:
  # Max facet values shown in UI lists
  max_facet_values: 50

ask_ai:
  enabled: true
  provider: "vllm_openai"
  model_path: "/supernova/data/lekhak/models/Qwen/Qwen3-4B-Instruct-2507"
  model_name: "Qwen3-4B-Instruct-2507"
  gpu_device: "0"
  host: "127.0.0.1"
  port: 5889
  base_url: "http://127.0.0.1:5889/v1"
  api_key: "EMPTY"
  dtype: "bfloat16"
  max_model_len: 8192
  gpu_memory_utilization: 0.35
  max_num_seqs: 16
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 1200
  max_context_records: 15
  max_question_chars: 2000
  conversation_history_turns: 4
  manage_vllm: true
  startup_timeout_sec: 300
  structured_output: true
  query_planning:
    enabled: true
    min_search_queries: 1
    max_search_queries: 15
    max_query_chars: 160
    top_k_per_query: 15
    max_tokens: 512
    temperature: 0.0
    structured_output: true

llm:
  model_path: /supernova/data/lekhak/models/Qwen2.5-14B-Instruct
  batch_size: 500
  gpu_memory_utilization: 0.80
  max_model_len: 8192
  disable: false

species_pipeline:
  cache_file: data/species_cache.json
  sqlite_file: data/species_split.sqlite

  # Services
  gbif_port: 5643
  gnparser_port: 5644
  gbif_timeout: 15
  gnparser_timeout: 20
  gbif_concurrency: 24
  gnparser_batch: 200

  # GBIF filtering
  gbif_accept_ranks: [SPECIES, SUBSPECIES]
  gbif_accept_matchtypes: [EXACT, FUZZY, HIGHERRANK]
  gbif_min_conf: 0

  # Dedupe (only for unresolved mentions)
  dedup_threshold: 98

  coarse:
    scientific_to_genus: true
    commonname_collapse: true

  vernacular_sqlite: data/vernacular_index.sqlite
  vernacular_validate: true
  vernacular_topk: 10
  vernacular_validate_top: 3
  vernacular_two_pass: true
  vernacular_drop_geo_default: false
